<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        // Supprimer les paramètres de suivi de l'URL affichée, sans effacer l'ancre.
        try {
          var url = new URL(window.location.href);
          var trackingKeys = Array.from(url.searchParams.keys()).filter(function (key) {
            return key.indexOf('utm_') === 0;
          });
          if (trackingKeys.length) {
            trackingKeys.forEach(function (key) { url.searchParams.delete(key); });
            window.history.replaceState(window.history.state, '', url.pathname + url.search + url.hash);
          }
        } catch (e) {}
      })();
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {}
      })();
    </script>
